  [schalter]
   /?, -h, -help, -help, -man zeigt hilfe an
   -v, -ver                   zeigt die version util an

  [befehlszeilenoptionen]
  
  datei oder pfad: imageviewer.exe g:\data\images\paris
  fullscreen     : vollbild
  beispiel       : imageviewer.exe g:\data\images\paris fullscreen
  launch         : app als slideshow starten
  beispiel       : imageviewer.exe g:\data\images\paris slideshow

  wenn keine datei oder pfad angegeben wird, werden die aktuellen
  dir und sub dire(en) nach einem bild gescannt

  Unterstützte Bildtypen oder Erweiterungen:
  .bmp, .gif, .jpg, .jpeg, .png, .pcx, .svg, .webp

  Erzeugen einer Cover-Art-Liste durch Suche (*) .mp3 an einem Tag
  generisch        : Slideshow <Audioquelle> <Tag> <Tagabfrage>
  Beispiel         : slideshow.exe g:\data\mp3\classic artist beethoven
  Unterstützte Tags: artist, title, album, genre and year
  * Einfache Suche, so dass 195 gleichbedeutend mit ?195? oder *195* ist
  
  Besondere Unterstützung für.mp3 die cover art
  wird aus den MP3 extrahiert und zeigt es, falls vorhanden.
  
  [navigation]
  
  pfeil links  | dpad links  | maus links         : zurück
  pfeil rechts | dpad rechts | maus rechts        : vorwärts
  num plus     | R2          | scrollen nach oben : vergrößern
  num min      | L2          | scrollen nach unten: verkleinen
  space        | taste a     | scrollen mid       : zoom und scale type zurücksetzen
  r / enter    | taste b     |                    : bild drehen
  z            | taste y     |                    : scale type
  i            | taste X     |                    : bildnamen anzeigen
  m            | start       |                    : bilddaten anzeigen
  f1           | zurück      |                    : hilfe anzeigen
  f11                                             : umschalten vollbild
  esc                                             : bewerbung schließen
